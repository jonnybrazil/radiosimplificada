<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Rádio Simplificada</title><link rel="stylesheet" href="styles.css?v=1"><style>.admin-page{max-width:760px;margin:0 auto;padding:30px 22px}.admin-page h1{color:#151515;font-size:32px}.admin-card{border:1px solid #d4d5d6;padding:22px;margin:18px 0}.admin-card label{display:block;margin:12px 0;color:#777;font-size:11px;font-weight:700;letter-spacing:.08em}.admin-card input,.admin-card textarea{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #d4d5d6;border-radius:4px;font:14px Arial}.admin-card button{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px 5px 0 0}.admin-card pre{white-space:pre-wrap;word-break:break-word;background:#f5f6f6;padding:12px;font-size:12px}.admin-nav{display:flex;justify-content:space-between}.status{color:#5e7c62;min-height:1.5em}</style></head>
<body><main class="admin-page"><nav class="admin-nav"><a href="index.html">← Rádio</a><span>RADIOSIMPLIFICADA</span></nav><h1>Administração</h1><p>Configure a rádio pelo JSON remoto. A chave é usada somente nesta sessão para autorizar gravações.</p><section class="admin-card"><h2>Acesso</h2><label>CHAVE ADMINISTRATIVA<input id="adminKey" type="password" autocomplete="off" placeholder="Informe a chave configurada no Apps Script"></label></section><section class="admin-card"><h2>Identidade</h2><label>NOME DA RÁDIO<input id="name"></label><label>DESCRIÇÃO<input id="description"></label><label>COR DE DESTAQUE<input id="accentColor" type="color"></label><label>BANNER (URL TEMPORÁRIA)<input id="banner" placeholder="https://..."></label></section><section class="admin-card"><h2>Programação</h2><label>SEQUÊNCIA DE IDS<input id="sequence" placeholder="45, 58, 50"></label><label>FAIXA PRIORITÁRIA (ID)<input id="priorityTrack" placeholder="opcional"></label><label>FAIXAS (uma por linha: ID | título | URL pública)<textarea id="tracks" rows="6" placeholder="45 | Minha faixa | audio/faixa-045.mp3"></textarea></label></section><section class="admin-card"><h2>Conteúdo</h2><label>MENSAGEM<textarea id="message" rows="3"></textarea></label><label>NOTÍCIAS<textarea id="notices" rows="3"></textarea></label><label>PATROCÍNIOS<textarea id="sponsors" rows="3"></textarea></label><label>CONTATO<textarea id="contact" rows="3"></textarea></label><button id="save">Salvar no JSON remoto</button><button id="download">Baixar radio.json</button><p id="status" class="status"></p></section><section class="admin-card"><h2>Prévia do JSON</h2><pre id="preview"></pre></section></main><script src="admin.js?v=2"></script></body></html>
