<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rádio Simplificada</title>
  <link id="radio-favicon" rel="icon" href="data:,">
  <style>html.js-loading body{visibility:hidden}</style><script>document.documentElement.classList.add('js-loading');setTimeout(()=>document.documentElement.classList.remove('js-loading'),4000)</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=39">
</head>
<body>
  <main class="radio-layout">
    <header class="radio-header">

      <div class="masthead"><strong id="radio-name">Rádio Simplificada</strong><span id="radio-description">Uma rádio baseada em playlists</span></div>
    </header>
    <section class="maintenance-page" aria-live="polite">
      <h1>Desculpe, estamos<br><em>em manutenção.</em></h1>
      <p>Em breve, teremos muitas novidades.</p>
    </section>
    <section class="hero">
      <div class="hero-image" id="hero-image"></div><div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="live-line"><span id="vu-meter" class="vu-meter" aria-label="Nível do áudio"><i class="vu-bar"></i><i class="vu-bar"></i><i class="vu-bar"></i></span><span>AO VIVO</span></div>
        <div class="player-row"><button id="play" class="play" type="button" aria-label="Iniciar rádio" aria-pressed="false"><span id="play-glyph"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 14 L48 32 L22 50 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></span></button><div class="track-box"><strong id="track">Iniciar rádio</strong></div></div>
      </div>
    </section>
    <nav class="quick-nav" aria-label="Conteúdo da rádio"><button data-panel="message">MENSAGEM</button><button data-panel="notices">MAIS OUVIDAS</button><button data-panel="sponsors">PATROCÍNIOS</button><button data-panel="contact">CONTATO</button></nav>
    <section class="panels"><article class="panel" data-content="message"><p id="message">Aguarde a mensagem da rádio.</p></article><article class="panel most-played-panel" data-content="notices"><div id="most-played-tabs" class="most-played-tabs" role="tablist" aria-label="Mais ouvidas"></div><div id="lyrics-display" class="lyrics-display" aria-live="polite">Selecione uma faixa para ouvir as letras.</div></article><article class="panel" data-content="sponsors"><div id="sponsors" class="sponsor-list">Ainda não há patrocínios ativos.</div></article><article class="panel" data-content="contact"><form id="contact-form" class="guestbook-form"><div class="guestbook-fields"><label>Nome<input name="name" type="text" maxlength="80" autocomplete="name" required></label><label>Cidade<input name="city" type="text" maxlength="80" autocomplete="address-level2" required></label><label>Estado<select name="state" autocomplete="address-level1" required><option value="">Selecione</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select></label></div><label>Mensagem<textarea name="message" rows="5" maxlength="500" required></textarea></label><input class="guestbook-trap" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><button type="submit">Enviar mensagem</button><p id="contact-status" class="guestbook-status" role="status" aria-live="polite"></p></form></article></section>
    <footer><span>© 2026 <span id="footer-name">Radiosimplificada</span>&nbsp;|&nbsp;<a href="admin.html">Admin</a></span></footer>
  </main>
  <script src="app.js?v=45"></script>
</body>
</html>
